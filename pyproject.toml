[project]
name = "alpha-chess"
version = "0.1.0"
description = "AlphaZero-style self-play chess research codebase inspired by AutoGo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chess>=1.10",
    "numpy>=1.24",
    "pytest>=8",
    "rich>=13",
    "torch>=2.0",
]

[project.scripts]
alpha-chess = "alpha_chess.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_chess"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
