<svg xmlns="http://www.w3.org/2000/svg" width="940" height="390" viewBox="0 0 940 390" role="img" aria-labelledby="title desc">
  <title id="title">AlphaChess Capability Progress</title>
  <desc id="desc">Simple line chart of AlphaChess capability over real result timestamps, similar to an AlphaGo rating-over-time graph. The y axis is a best-so-far local Elo proxy derived from the conservative direct Stockfish score-rate proxy: score divided by max(games, 4), converted with 400 times log10(p divided by 1-p). Scoreless gates are drawn at a floor of less than or equal to -800 Elo because their logit is otherwise undefined. The plotted direct Stockfish checks follow the README progress table from 2026-05-18T09:14:04-07:00 through 2026-05-20T18:52:50-07:00, and the best-so-far line extends to the latest PGN timestamp 2026-05-20T18:52:50-07:00. Commit-derived rows use git log --date=iso-strict times; marked PGN/report/teacher/checkpoint rows use artifact timestamps or mtimes. The 0 Elo line marks the local Stockfish promotion gate.</desc>
  <!-- Key source timestamps:
       2026-05-18T09:14:04-07:00: first direct gate, 0.0/2, x=92.0
       2026-05-18T13:18:35-07:00: focused MultiPV zero gate, 0.0/2, x=145.6
       2026-05-18T16:03:41-07:00: material-prior smoke, 0.5/2, x=181.8
       2026-05-19T10:31:47-07:00: policy-head broad gate, 0.5/4, x=424.6
       2026-05-20T17:15:10-07:00: latest-source repair material-depth-4 gate, 0.0/2, x=828.6
       2026-05-20T18:38:19-07:00: lower-pressure probability direct check, 0.0/2, x=846.8
       2026-05-20T18:52:50-07:00: fresh context blend direct check, 0.0/2, x=850.0 -->
  <rect width="940" height="390" fill="#fbfbf8"/>

  <text x="92" y="34" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#202124">AlphaChess capability progress</text>
  <text x="92" y="56" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">Best-so-far conservative direct-Stockfish Elo proxy from real commit/artifact timestamps. Not calibrated chess Elo.</text>

  <g font-family="Arial, sans-serif" font-size="11" fill="#5f6368">
    <line x1="92" y1="68" x2="92" y2="310" stroke="#5f6368" stroke-width="1"/>
    <line x1="92" y1="310" x2="850" y2="310" stroke="#5f6368" stroke-width="1"/>

    <line x1="92" y1="68" x2="850" y2="68" stroke="#d04a3a" stroke-width="1.5" stroke-dasharray="6 5"/>
    <line x1="92" y1="128.5" x2="850" y2="128.5" stroke="#e3e4df" stroke-width="1"/>
    <line x1="92" y1="189" x2="850" y2="189" stroke="#e3e4df" stroke-width="1"/>
    <line x1="92" y1="249.5" x2="850" y2="249.5" stroke="#e3e4df" stroke-width="1"/>
    <line x1="92" y1="310" x2="850" y2="310" stroke="#e3e4df" stroke-width="1"/>

    <text x="58" y="72" text-anchor="end">0</text>
    <text x="58" y="132.5" text-anchor="end">-200</text>
    <text x="58" y="193" text-anchor="end">-400</text>
    <text x="58" y="253.5" text-anchor="end">-600</text>
    <text x="58" y="314" text-anchor="end">&lt;= -800</text>
    <text x="858" y="72" fill="#a23b31">promotion gate</text>

    <text x="92" y="335" text-anchor="middle">05-18 09:14</text>
    <text x="181.8" y="335" text-anchor="middle">05-18 16:03</text>
    <text x="424.6" y="335" text-anchor="middle">05-19 10:31</text>
