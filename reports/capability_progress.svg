  <desc id="desc">Line chart of AlphaChess capability over real timestamps. The y axis is a conservative direct Stockfish score-rate proxy: score divided by max(games, 4), with the best value seen so far plotted over time. Data points include 2026-05-18T09:14:04-07:00 0.0/2 at 0 percent, 2026-05-18T13:18:35-07:00 0.0/2 at 0 percent, 2026-05-18T16:03:41-07:00 0.5/2 at 12.5 percent, 2026-05-18T23:13:16-07:00 0.5/1 at 12.5 percent after conservative scaling, 2026-05-19T00:04:01-07:00 0.5/1 at 12.5 percent after conservative scaling, 2026-05-19T10:31:47-07:00 0.5/4 at 12.5 percent, 2026-05-19T13:57:45-07:00 0.5/2 at 12.5 percent after conservative scaling, 2026-05-19T18:01:50-07:00 0.5/2 at 12.5 percent after conservative scaling, 2026-05-19T18:48:42-07:00 0.0/2 at 0 percent, 2026-05-19T19:11:04-07:00 0.0/2 guarded check at 0 percent, 2026-05-19T19:34:49-07:00 broad65k gate at 0 percent, 2026-05-19T19:56:50-07:00 expert-mix gate at 0 percent, 2026-05-19T20:49:36-07:00 fullnet192 puzzle-mix gate at 0 percent, and 2026-05-19T21:22:07-07:00 fullnet192 CPU loss-overfit gate at 0 percent. The 50 percent line marks the local Stockfish promotion gate.</desc>
