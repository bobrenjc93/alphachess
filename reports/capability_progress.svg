    <text x="446" y="158" font-weight="700" fill="#1f6f8b">0.5/4 first 4-game draw</text>
    <text x="585" y="188" fill="#1f6f8b">12.5% proxy, about -338 Elo vs gate</text>
    <text x="302" y="150" fill="#9a5b16">one-game PV-line draws</text>
